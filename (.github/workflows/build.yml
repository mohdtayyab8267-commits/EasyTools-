        cat << 'EOF' > app/src/main/java/com/easytools/app/ImageToPdfActivity.kt
        package com.easytools.app
        import android.app.Activity
        import android.content.Intent
        import android.graphics.pdf.PdfDocument
        import android.net.Uri
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream
        class ImageToPdfActivity : AppCompatActivity() {
            private var uri: Uri? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_to_pdf)
                val tv = findViewById<TextView>(R.id.tvStatus)
                val btnCreate = findViewById<Button>(R.id.btnCreatePdf)
                findViewById<Button>(R.id.btnSelectImage).setOnClickListener {
                    @Suppress("DEPRECATION")
                    startActivityForResult(Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI), 1)
                }
                btnCreate.setOnClickListener {
                    uri?.let {
                        @Suppress("DEPRECATION")
                        val bmp = MediaStore.Images.Media.getBitmap(contentResolver, it)
                        val doc = PdfDocument()
                        val page = doc.startPage(PdfDocument.PageInfo.Builder(bmp.width, bmp.height, 1).create())
                        page.canvas.drawBitmap(bmp, 0f, 0f, null)
                        doc.finishPage(page)
                        val file = File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "PDF_${System.currentTimeMillis()}.pdf")
                        doc.writeTo(FileOutputStream(file))
                        doc.close()
                        Toast.makeText(this, "PDF Saved!", Toast.LENGTH_LONG).show()
                        tv.text = "Saved: ${file.name}"
                    }
                }
            }
            @Suppress("DEPRECATION")
            override fun onActivityResult(r: Int, res: Int, data: Intent?) {
                super.onActivityResult(r, res, data)
                if (r == 1 && res == Activity.RESULT_OK && data != null) {
                    uri = data.data
                    findViewById<TextView>(R.id.tvStatus).text = "Image Selected!"
                    findViewById<Button>(R.id.btnCreatePdf).isEnabled = true
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/ImageCompressorActivity.kt
        package com.easytools.app
        import android.app.Activity
        import android.content.Intent
        import android.graphics.Bitmap
        import android.net.Uri
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream
        class ImageCompressorActivity : AppCompatActivity() {
            private var uri: Uri? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_compressor)
                val tv = findViewById<TextView>(R.id.tvCompStatus)
                val btnComp = findViewById<Button>(R.id.btnCompress)
                findViewById<Button>(R.id.btnSelectCompImage).setOnClickListener {
                    @Suppress("DEPRECATION")
                    startActivityForResult(Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI), 2)
                }
                btnComp.setOnClickListener {
                    uri?.let {
                        @Suppress("DEPRECATION")
                        val bmp = MediaStore.Images.Media.getBitmap(contentResolver, it)
                        val file = File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "Compressed_${System.currentTimeMillis()}.jpg")
                        val out = FileOutputStream(file)
                        bmp.compress(Bitmap.CompressFormat.JPEG, 50, out)
                        out.flush()
                        out.close()
                        Toast.makeText(this, "Image Compressed & Saved!", Toast.LENGTH_LONG).show()
                        tv.text = "Compressed: ${file.name}"
                    }
                }
            }
            @Suppress("DEPRECATION")
            override fun onActivityResult(r: Int, res: Int, data: Intent?) {
                super.onActivityResult(r, res, data)
                if (r == 2 && res == Activity.RESULT_OK && data != null) {
                    uri = data.data
                    findViewById<TextView>(R.id.tvCompStatus).text = "Image Selected for Compression!"
                    findViewById<Button>(R.id.btnCompress).isEnabled = true
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/TextToSpeechActivity.kt
        package com.easytools.app
        import android.os.Bundle
        import android.speech.tts.TextToSpeech
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.util.Locale
        class TextToSpeechActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
            private var tts: TextToSpeech? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_text_to_speech)
                tts = TextToSpeech(this, this)
                val etInput = findViewById<EditText>(R.id.etSpeechInput)
                findViewById<Button>(R.id.btnSpeak).setOnClickListener {
                    val text = etInput.text.toString()
                    if (text.isNotEmpty()) {
                        tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, null)
                    } else {
                        Toast.makeText(this, "Please enter some text", Toast.LENGTH_SHORT).show()
                    }
                }
            }
            override fun onInit(status: Int) {
                if (status == TextToSpeech.SUCCESS) {
                    tts?.language = Locale.US
                }
            }
            override fun onDestroy() {
                tts?.stop()
                tts?.shutdown()
                super.onDestroy()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/AgeCalculatorActivity.kt
        package com.easytools.app
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import java.util.Calendar
        class AgeCalculatorActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_age_calculator)
                val etYear = findViewById<EditText>(R.id.etYear)
                val tvResult = findViewById<TextView>(R.id.tvAgeResult)
                findViewById<Button>(R.id.btnCalculateAge).setOnClickListener {
                    val yearStr = etYear.text.toString()
                    if (yearStr.isNotEmpty()) {
                        val birthYear = yearStr.toInt()
                        val currentYear = Calendar.getInstance().get(Calendar.YEAR)
                        if (birthYear <= currentYear && birthYear > 1900) {
                            val age = currentYear - birthYear
                            tvResult.text = "Your Age is: $age Years"
                        } else {
                            tvResult.text = "Please enter a valid birth year"
                        }
                    } else {
                        tvResult.text = "Please enter your birth year"
                    }
                }
            }
        }
        EOF

