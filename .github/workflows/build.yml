        cat << 'EOF' > app/src/main/java/com/easytools/app/TextToSpeechActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import android.app.Activity

        class TextToSpeechActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_text_to_speech)

                val etInput = findViewById<EditText>(R.id.etSpeechInput)
                val btnSpeak = findViewById<Button>(R.id.btnSpeak)
                val btnBack = findViewById<Button>(R.id.btnBackSpeech)

                btnSpeak.setOnClickListener {
                    val text = etInput.text.toString().trim()
                    if (text.isNotEmpty()) {
                        Toast.makeText(this, "Speaking: $text", Toast.LENGTH_SHORT).show()
                    } else {
                        Toast.makeText(this, "Please enter some text first", Toast.LENGTH_SHORT).show()
                    }
                }

                btnBack.setOnClickListener { finish() }
            }
        }
        EOF

