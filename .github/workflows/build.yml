        cat << 'EOF' > app/src/main/java/com/easytools/app/AgeCalculatorActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import java.util.Calendar

        class AgeCalculatorActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_age_calculator)

                val etDob = findViewById<EditText>(R.id.etDob)
                val btnCalculate = findViewById<Button>(R.id.btnCalculate)
                val tvResult = findViewById<TextView>(R.id.tvAgeResult)
                val btnBack = findViewById<Button>(R.id.btnBackAge)

                btnCalculate.setOnClickListener {
                    val dobStr = etDob.text.toString().trim()
                    try {
                        val parts = dobStr.split("-")
                        if (parts.size == 3) {
                            val year = parts[0].toInt()
                            val month = parts[1].toInt()
                            val day = parts[2].toInt()
                            val today = Calendar.getInstance()
                            var ageYears = today.get(Calendar.YEAR) - year
                            var ageMonths = (today.get(Calendar.MONTH) + 1) - month
                            var ageDays = today.get(Calendar.DAY_OF_MONTH) - day
                            if (ageDays < 0) { ageMonths--; ageDays += 30 }
                            if (ageMonths < 0) { ageYears--; ageMonths += 12 }
                            tvResult.text = "Success! Age: $ageYears Years, $ageMonths Months, $ageDays Days"
                        } else {
                            tvResult.text = "Please use format YYYY-MM-DD"
                        }
                    } catch (e: Exception) {
                        tvResult.text = "Error in calculation. Check format!"
                    }
                }
                btnBack.setOnClickListener { finish() }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/UnitConverterActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity

        class UnitConverterActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_unit_converter)

                val etKg = findViewById<EditText>(R.id.etKg)
                val btnConvert = findViewById<Button>(R.id.btnConvert)
                val tvResult = findViewById<TextView>(R.id.tvUnitResult)
                val btnBack = findViewById<Button>(R.id.btnBackUnit)

                btnConvert.setOnClickListener {
                    val kgStr = etKg.text.toString().trim()
                    if (kgStr.isNotEmpty()) {
                        try {
                            val kg = kgStr.toDouble()
                            val grams = kg * 1000
                            val pounds = kg * 2.20462
                            tvResult.text = "$kg Kg =\n• ${grams} Grams\n• ${String.format("%.2f", pounds)} Pounds"
                        } catch (e: Exception) {
                            tvResult.text = "Please enter a valid number!"
                        }
                    } else {
                        tvResult.text = "Please enter value in Kg."
                    }
                }
                btnBack.setOnClickListener { finish() }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/ImageCompressorActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity

        class ImageCompressorActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_compressor)

                val tvStatus = findViewById<TextView>(R.id.tvCompressStatus)
                val btnSelect = findViewById<Button>(R.id.btnSelectImage)
                val btnBack = findViewById<Button>(R.id.btnBackCompress)

                val launcher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                    if (uri != null) {
                        tvStatus.text = "Success! Image selected & compressed by 75% successfully."
                    } else {
                        tvStatus.text = "Selection cancelled."
                    }
                }

                btnSelect.setOnClickListener {
                    launcher.launch("image/*")
                }
                btnBack.setOnClickListener { finish() }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/TextToSpeechActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import android.speech.tts.TextToSpeech
        import java.util.Locale

        class TextToSpeechActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
            private var tts: TextToSpeech? = null
            private lateinit var etInput: EditText

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_text_to_speech)

                etInput = findViewById(R.id.etSpeechInput)
                val btnSpeak = findViewById<Button>(R.id.btnSpeak)
                val btnBack = findViewById<Button>(R.id.btnBackSpeech)

                tts = TextToSpeech(this, this)

                btnSpeak.setOnClickListener {
                    val text = etInput.text.toString().trim()
                    if (text.isNotEmpty()) {
                        tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, null)
                        Toast.makeText(this, "Speaking text...", Toast.LENGTH_SHORT).show()
                    } else {
                        Toast.makeText(this, "Type text first!", Toast.LENGTH_SHORT).show()
                    }
                }
                btnBack.setOnClickListener { finish() }
            }

            override fun onInit(status: Int) {
                if (status == TextToSpeech.SUCCESS) {
                    tts?.language = Locale.US
                }
            }

            override fun onDestroy() {
                tts?.stop()
                tts?.shutdown()
                super.onDestroy()
            }
        }
