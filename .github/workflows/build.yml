        cat << 'EOF' > app/src/main/java/com/easytools/app/MainActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.content.Intent
        import android.app.Activity
        import androidx.cardview.widget.CardView

        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                findViewById<CardView>(R.id.cardImageCompressor).setOnClickListener {
                    startActivity(Intent(this, ImageCompressorActivity::class.java))
                }
                findViewById<CardView>(R.id.cardTextToSpeech).setOnClickListener {
                    startActivity(Intent(this, TextToSpeechActivity::class.java))
                }
                findViewById<CardView>(R.id.cardAgeCalculator).setOnClickListener {
                    startActivity(Intent(this, AgeCalculatorActivity::class.java))
                }
                findViewById<CardView>(R.id.cardUnitConverter).setOnClickListener {
                    startActivity(Intent(this, UnitConverterActivity::class.java))
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/AgeCalculatorActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import android.app.Activity
        import java.util.Calendar

        class AgeCalculatorActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_age_calculator)

                val etDob = findViewById<EditText>(R.id.etDob)
                val btnCalculate = findViewById<Button>(R.id.btnCalculate)
                val tvResult = findViewById<TextView>(R.id.tvAgeResult)
                val btnBack = findViewById<Button>(R.id.btnBackAge)

                btnCalculate.setOnClickListener {
                    val dobStr = etDob.text.toString().trim()
                    try {
                        val parts = dobStr.split("-")
                        if (parts.size == 3) {
                            val year = parts[0].toInt()
                            val month = parts[1].toInt()
                            val day = parts[2].toInt()

                            val today = Calendar.getInstance()
                            var ageYears = today.get(Calendar.YEAR) - year
                            var ageMonths = (today.get(Calendar.MONTH) + 1) - month
                            var ageDays = today.get(Calendar.DAY_OF_MONTH) - day

                            if (ageDays < 0) {
                                ageMonths--
                                ageDays += 30
                            }
                            if (ageMonths < 0) {
                                ageYears--
                                ageMonths += 12
                            }

                            tvResult.text = "Your Age: $ageYears Years, $ageMonths Months, $ageDays Days"
                        } else {
                            tvResult.text = "Please enter format YYYY-MM-DD"
                        }
                    } catch (e: Exception) {
                        tvResult.text = "Invalid date format!"
                    }
                }

                btnBack.setOnClickListener { finish() }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/UnitConverterActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import android.app.Activity

        class UnitConverterActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_unit_converter)

                val etKg = findViewById<EditText>(R.id.etKg)
                val btnConvert = findViewById<Button>(R.id.btnConvert)
                val tvResult = findViewById<TextView>(R.id.tvUnitResult)
                val btnBack = findViewById<Button>(R.id.btnBackUnit)

                btnConvert.setOnClickListener {
                    val kgStr = etKg.text.toString().trim()
                    if (kgStr.isNotEmpty()) {
                        try {
                            val kg = kgStr.toDouble()
                            val grams = kg * 1000
                            tvResult.text = "$kg Kg = $grams Grams"
                        } catch (e: Exception) {
                            tvResult.text = "Please enter a valid number!"
                        }
                    } else {
                        tvResult.text = "Please enter value in Kg"
                    }
                }

                btnBack.setOnClickListener { finish() }
            }
        }
        EOF

