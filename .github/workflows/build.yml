name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.easytools.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp"
            android:gravity="center_horizontal">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="EasyTools v2.0"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginTop="10dp"
                android:layout_marginBottom="16dp" />

            <!-- ScrollView for all Tools Dashboard Grid/List -->
            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical">

                    <Button
                        android:id="@+id/btnImgToPdf"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="🖼️ Image to PDF"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnPdfToImg"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📄 PDF to Image"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnCompressor"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📦 Image Compressor"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnQrScanner"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📷 QR Scanner"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnUnitConverter"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="⚖️ Unit Converter"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnNotes"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📝 Notes / To-Do"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnPremium"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="⭐ Premium Screen"
                        android:layout_marginBottom="8dp" />

                </LinearLayout>
            </ScrollView>

            <!-- AdMob Banner Placeholder Simulation View -->
            <TextView
                android:layout_width="match_parent"
                android:layout_height="50dp"
                android:background="#DDDDDD"
                android:gravity="center"
                android:text="[ AdMob Banner Ad Container ]"
                android:textColor="#555555"
                android:textSize="12sp"
                android:layout_marginTop="8dp" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/MainActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                findViewById<Button>(R.id.btnImgToPdf).setOnClickListener {
                    Toast.makeText(this, "Image to PDF Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnPdfToImg).setOnClickListener {
                    Toast.makeText(this, "PDF to Image Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnCompressor).setOnClickListener {
                    Toast.makeText(this, "Image Compressor Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnQrScanner).setOnClickListener {
                    Toast.makeText(this, "QR Scanner Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnUnitConverter).setOnClickListener {
                    Toast.makeText(this, "Unit Converter Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnNotes).setOnClickListener {
                    Toast.makeText(this, "Notes / To-Do Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnPremium).setOnClickListener {
                    Toast.makeText(this, "Premium Screen Clicked", Toast.LENGTH_SHORT).show()
                }
            }
        }
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.1.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.easytools.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.easytools.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 2
                versionName = "2.0"
            }
            buildTypes {
                release { isMinifyEnabled = false }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "EasyTools"
        include(":app")
        EOF

        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        arguments: assembleDebug
        gradle-version: '8.1'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EasyTools-APK
        path: app/build/outputs/apk/debug/app-debug.apk
