name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clean Previous Build Files
      run: |
        rm -rf app/src/main/java/com/easytools/app/*
        rm -rf app/src/main/res/layout/*
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

    - name: Generate Fresh Project Files
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:icon="@android:drawable/ic_menu_manage"
                android:roundIcon="@android:drawable/ic_menu_manage"
                android:supportsRtl="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".AgeCalculatorActivity" android:exported="false" />
                <activity android:name=".UnitConverterActivity" android:exported="false" />
                <activity android:name=".ImageCompressorActivity" android:exported="false" />
                <activity android:name=".TextToSpeechActivity" android:exported="false" />
                <activity android:name=".QrScannerActivity" android:exported="false" />
                <activity android:name=".ImageToPdfActivity" android:exported="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1B2A"
            android:padding="16dp">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="#1B263B"
                android:padding="16dp"
                android:layout_marginBottom="16dp"
                android:gravity="center_horizontal">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="EasyTools v17.0"
                    android:textSize="26sp"
                    android:textStyle="bold"
                    android:textColor="#FFFFFF"/>
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="All Tools Functional"
                    android:textSize="14sp"
                    android:textColor="#B0BEC5"
                    android:layout_marginTop="4dp"/>
