        import android.widget.TextView
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity

        class ImageToPdfActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_to_pdf)

                val tvStatus = findViewById<TextView>(R.id.tvPdfStatus)
                val btnConvert = findViewById<Button>(R.id.btnConvertPdf)
                val btnBack = findViewById<Button>(R.id.btnBackPdf)

                val launcher = registerForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                    if (uri != null) {
                        tvStatus.text = "Success! Image converted and saved as PDF document."
                    } else {
                        tvStatus.text = "Selection cancelled."
                    }
                }

                btnConvert.setOnClickListener {
                    launcher.launch("image/*")
                }
                btnBack.setOnClickListener { finish() }
