name: Build EasyTools APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract EasyTools source
        run: |
          rm -rf EasyToolsBuild
          mkdir EasyToolsBuild
          unzip -q EasyTools_Source.zip -d EasyToolsBuild

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Build debug APK
        working-directory: EasyToolsBuild
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyTools-debug-apk
          path: EasyToolsBuild/app/build/outputs/apk/debug/app-debug.apk
