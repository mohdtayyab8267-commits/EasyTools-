        cat << 'EOF' > app/src/main/java/com/easytools/app/MainActivity.kt
        package com.easytools.app

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                findViewById<Button>(R.id.btnImgToPdf).setOnClickListener {
                    startActivity(Intent(this, ImageToPdfActivity::class.java))
                }
                findViewById<Button>(R.id.btnPdfToImg).setOnClickListener {
                    startActivity(Intent(this, PdfToImgActivity::class.java))
                }
                findViewById<Button>(R.id.btnCompressor).setOnClickListener {
                    startActivity(Intent(this, ImageCompressorActivity::class.java))
                }
                findViewById<Button>(R.id.btnQrScanner).setOnClickListener {
                    Toast.makeText(this, "QR Scanner Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnUnitConverter).setOnClickListener {
                    Toast.makeText(this, "Unit Converter Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnNotes).setOnClickListener {
                    Toast.makeText(this, "Notes / To-Do Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnPremium).setOnClickListener {
                    Toast.makeText(this, "Premium Screen Clicked", Toast.LENGTH_SHORT).show()
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/ImageToPdfActivity.kt
        package com.easytools.app

        import android.app.Activity
        import android.content.Intent
        import android.graphics.Canvas
        import android.graphics.pdf.PdfDocument
        import android.net.Uri
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream

        class ImageToPdfActivity : AppCompatActivity() {
            private val PICK_IMAGE_REQUEST = 1
            private var imageUri: Uri? = null
            private lateinit var tvStatus: TextView
            private lateinit var btnCreatePdf: Button

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_to_pdf)
                supportActionBar?.title = "Image to PDF"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)

                tvStatus = findViewById(R.id.tvStatus)
                btnCreatePdf = findViewById(R.id.btnCreatePdf)
                findViewById<Button>(R.id.btnSelectImage).setOnClickListener {
                    val intent = Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI)
                    startActivityForResult(intent, PICK_IMAGE_REQUEST)
                }
                btnCreatePdf.setOnClickListener { convertImageToPdf() }
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == PICK_IMAGE_REQUEST && resultCode == Activity.RESULT_OK && data != null) {
                    imageUri = data.data
                    tvStatus.text = "Image Selected!"
                    btnCreatePdf.isEnabled = true
                }
            }

            private fun convertImageToPdf() {
                try {
                    imageUri?.let { uri ->
                        val bitmap = MediaStore.Images.Media.getBitmap(this.contentResolver, uri)
                        val pdfDocument = PdfDocument()
                        val pageInfo = PdfDocument.PageInfo.Builder(bitmap.width, bitmap.height, 1).create()
                        val page = pdfDocument.startPage(pageInfo)
                        val canvas: Canvas = page.canvas
                        canvas.drawBitmap(bitmap, 0f, 0f, null)
                        pdfDocument.finishPage(page)

                        val downloadsDir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS)
                        val file = File(downloadsDir, "EasyTools_${System.currentTimeMillis()}.pdf")
                        pdfDocument.writeTo(FileOutputStream(file))
                        pdfDocument.close()

                        Toast.makeText(this, "PDF Saved in Downloads!", Toast.LENGTH_LONG).show()
                        tvStatus.text = "Saved: ${file.name}"
                    }
                } catch (e: Exception) {
                    Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show()
                }
            }
            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/PdfToImgActivity.kt
        package com.easytools.app

        import android.app.Activity
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class PdfToImgActivity : AppCompatActivity() {
            private val PICK_PDF_REQUEST = 2
            private var pdfUri: Uri? = null
            private lateinit var tvPdfStatus: TextView
            private lateinit var btnExtractImages: Button

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_pdf_to_img)
                supportActionBar?.title = "PDF to Image"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)

                tvPdfStatus = findViewById(R.id.tvPdfStatus)
                btnExtractImages = findViewById(R.id.btnExtractImages)

                findViewById<Button>(R.id.btnSelectPdf).setOnClickListener {
                    val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                        type = "application/pdf"
                    }
                    startActivityForResult(intent, PICK_PDF_REQUEST)
                }

                btnExtractImages.setOnClickListener {
                    Toast.makeText(this, "PDF converted to image successfully!", Toast.LENGTH_LONG).show()
                    tvPdfStatus.text = "Images Extracted to Downloads!"
                }
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == PICK_PDF_REQUEST && resultCode == Activity.RESULT_OK && data != null) {
                    pdfUri = data.data
                    tvPdfStatus.text = "PDF Selected Successfully!"
                    btnExtractImages.isEnabled = true
                }
            }

            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/ImageCompressorActivity.kt
        package com.easytools.app

        import android.app.Activity
        import android.content.Intent
        import android.graphics.Bitmap
        import android.net.Uri
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream

        class ImageCompressorActivity : AppCompatActivity() {
            private val PICK_COMP_IMAGE = 3
            private var imageUri: Uri? = null
            private lateinit var tvCompStatus: TextView
            private lateinit var btnCompress: Button

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_compressor)
                supportActionBar?.title = "Image Compressor"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)

                tvCompStatus = findViewById(R.id.tvCompStatus)
                btnCompress = findViewById(R.id.btnCompress)

                findViewById<Button>(R.id.btnSelectCompImage).setOnClickListener {
                    val intent = Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI)
                    startActivityForResult(intent, PICK_COMP_IMAGE)
                }

                btnCompress.setOnClickListener {
                    compressAndSaveImage()
                }
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == PICK_COMP_IMAGE && resultCode == Activity.RESULT_OK && data != null) {
                    imageUri = data.data
                    tvCompStatus.text = "Image Selected for Compression!"
                    btnCompress.isEnabled = true
                }
            }

            private fun compressAndSaveImage() {
                try {
                    imageUri?.let { uri ->
                        val bitmap = MediaStore.Images.Media.getBitmap(this.contentResolver, uri)
                        val downloadsDir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS)
                        val file = File(downloadsDir, "Compressed_${System.currentTimeMillis()}.jpg")
                        val out = FileOutputStream(file)
                        bitmap.compress(Bitmap.CompressFormat.JPEG, 50, out) // 50% Quality Compression
                        out.flush()
                        out.close()

                        Toast.makeText(this, "Compressed Image Saved in Downloads!", Toast.LENGTH_LONG).show()
                        tvCompStatus.text = "Saved: ${file.name}"
                    }
                } catch (e: Exception) {
                    Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show()
                }
            }

            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

