name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.easytools.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".QrScannerActivity" android:exported="false" />
                <activity android:name=".UnitConverterActivity" android:exported="false" />
                <activity android:name=".ImageToPdfActivity" android:exported="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp"
            android:gravity="center_horizontal">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="EasyTools v5.0"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginTop="10dp"
                android:layout_marginBottom="16dp" />

            <Button
                android:id="@+id/btnQrScanner"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="📷 QR Scanner"
                android:layout_marginBottom="12dp" />

            <Button
                android:id="@+id/btnUnitConverter"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="⚖️ Unit Converter"
                android:layout_marginBottom="12dp" />

            <Button
                android:id="@+id/btnImgToPdf"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="🖼 Image to PDF"
                android:layout_marginBottom="12dp" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_qr_scanner.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="20dp"
            android:gravity="center">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="QR Scanner"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginBottom="30dp" />

            <TextView
                android:id="@+id/tvScanResult"
                android:layout_width="match_parent"
                android:layout_height="120dp"
                android:background="#EEEEEE"
                android:gravity="center"
                android:text="Tap below to simulate scan"
                android:textSize="16sp"
                android:padding="10dp"
                android:layout_marginBottom="20dp" />

            <Button
                android:id="@+id/btnScan"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Start Scan" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_unit_converter.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="20dp"
            android:gravity="center">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Unit Converter"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginBottom="30dp" />

            <EditText
                android:id="@+id/etKg"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:hint="Enter Kg"
                android:inputType="numberDecimal"
                android:layout_marginBottom="16dp" />

            <Button
                android:id="@+id/btnConvert"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Convert to Grams"
                android:layout_marginBottom="20dp" />

            <TextView
                android:id="@+id/tvConvertedResult"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Result will appear here"
                android:textSize="18sp" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_image_to_pdf.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="20dp"
            android:gravity="center">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Image to PDF"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginBottom="30dp" />

            <Button
                android:id="@+id/btnSelectImage"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Select Image"
                android:layout_marginBottom="16dp" />

            <TextView
                android:id="@+id/tvStatus"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="No image selected"
                android:textSize="16sp"
                android:layout_marginBottom="20dp" />

            <Button
                android:id="@+id/btnCreatePdf"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Create PDF"
                android:enabled="false" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/MainActivity.kt
        package com.easytools.app

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                findViewById<Button>(R.id.btnQrScanner).setOnClickListener {
                    startActivity(Intent(this, QrScannerActivity::class.java))
                }
                findViewById<Button>(R.id.btnUnitConverter).setOnClickListener {
                    startActivity(Intent(this, UnitConverterActivity::class.java))
                }
                findViewById<Button>(R.id.btnImgToPdf).setOnClickListener {
                    startActivity(Intent(this, ImageToPdfActivity::class.java))
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/QrScannerActivity.kt
        package com.easytools.app
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        class QrScannerActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_qr_scanner)
                supportActionBar?.title = "QR Scanner"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)
                val tvResult = findViewById<TextView>(R.id.tvScanResult)
                findViewById<Button>(R.id.btnScan).setOnClickListener {
                    tvResult.text = "Scanned Result: Success!"
                }
            }
            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/UnitConverterActivity.kt
        package com.easytools.app
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        class UnitConverterActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_unit_converter)
                supportActionBar?.title = "Unit Converter"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)
                val etKg = findViewById<EditText>(R.id.etKg)
                val tvResult = findViewById<TextView>(R.id.tvConvertedResult)
                findViewById<Button>(R.id.btnConvert).setOnClickListener {
                    val kgText = etKg.text.toString()
                    if (kgText.isNotEmpty()) {
                        val kg = kgText.toDouble()
                        val grams = kg * 1000
                        tvResult.text = "$kg Kg = $grams Grams"
                    } else {
                        tvResult.text = "Please enter a value"
                    }
                }
            }
            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/ImageToPdfActivity.kt
        package com.easytools.app
        import android.app.Activity
        import android.content.Intent
        import android.graphics.pdf.PdfDocument
        import android.net.Uri
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream
        class ImageToPdfActivity : AppCompatActivity() {
            private var uri: Uri? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_to_pdf)
                supportActionBar?.title = "Image to PDF"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)
                val tv = findViewById<TextView>(R.id.tvStatus)
                val btnCreate = findViewById<Button>(R.id.btnCreatePdf)
                findViewById<Button>(R.id.btnSelectImage).setOnClickListener {
                    @Suppress("DEPRECATION")
                    startActivityForResult(Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI), 1)
                }
                btnCreate.setOnClickListener {
                    uri?.let {
                        @Suppress("DEPRECATION")
                        val bmp = MediaStore.Images.Media.getBitmap(contentResolver, it)
                        val doc = PdfDocument()
                        val page = doc.startPage(PdfDocument.PageInfo.Builder(bmp.width, bmp.height, 1).create())
                        page.canvas.drawBitmap(bmp, 0f, 0f, null)
                        doc.finishPage(page)
                        val file = File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "PDF_${System.currentTimeMillis()}.pdf")
                        doc.writeTo(FileOutputStream(file))
                        doc.close()
                        Toast.makeText(this, "PDF Saved!", Toast.LENGTH_LONG).show()
                        tv.text = "Saved: ${file.name}"
                    }
                }
            }
            @Suppress("DEPRECATION")
            override fun onActivityResult(r: Int, res: Int, data: Intent?) {
                super.onActivityResult(r, res, data)
                if (r == 1 && res == Activity.RESULT_OK && data != null) {
                    uri = data.data
                    findViewById<TextView>(R.id.tvStatus).text = "Image Selected!"
                    findViewById<Button>(R.id.btnCreatePdf).isEnabled = true
                }
            }
            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.1.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.easytools.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.easytools.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 11
                versionName = "11.0"
            }
            buildTypes {
                release { isMinifyEnabled = false }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "EasyTools"
        include(":app")
        EOF

        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        arguments: assembleDebug
        gradle-version: '8.1'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EasyTools-APK
        path: app/build/outputs/apk/debug/app-debug.apk
