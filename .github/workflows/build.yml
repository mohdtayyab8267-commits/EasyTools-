            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1B2A"
            android:padding="20dp">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Unit Converter" android:textSize="24sp" android:textStyle="bold" android:textColor="#FFFFFF" android:layout_marginBottom="20dp"/>
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Enter Value in Kilograms (Kg):" android:textColor="#B0BEC5" android:textSize="14sp" android:layout_marginBottom="8dp"/>
            <EditText android:id="@+id/etKg" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="10" android:textColor="#FFFFFF" android:textColorHint="#546E7A" android:background="#1B263B" android:padding="12dp" android:layout_marginBottom="20dp" android:inputType="numberDecimal"/>
            <Button android:id="@+id/btnConvert" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Convert Units" android:backgroundTint="#1B263B" android:textColor="#FFFFFF" android:layout_marginBottom="20dp"/>
            <TextView android:id="@+id/tvUnitResult" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Result will appear here..." android:textSize="16sp" android:textStyle="bold" android:textColor="#4CAF50" android:gravity="center" android:layout_marginBottom="30dp"/>
            <Button android:id="@+id/btnBackUnit" android:layout_width="wrap_content" android:layout_height="wrap_
