name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.easytools.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".ImageToPdfActivity" android:exported="false" />
                <activity android:name=".PdfToImgActivity" android:exported="false" />
                <activity android:name=".ImageCompressorActivity" android:exported="false" />
                <activity android:name=".QrScannerActivity" android:exported="false" />
                <activity android:name=".UnitConverterActivity" android:exported="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp"
            android:gravity="center_horizontal">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="EasyTools v2.0"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginTop="10dp"
                android:layout_marginBottom="16dp" />

            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical">

                    <Button
                        android:id="@+id/btnImgToPdf"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="🖼 Image to PDF"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnPdfToImg"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📄 PDF to Image"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnCompressor"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📦 Image Compressor"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnQrScanner"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📷 QR Scanner"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnUnitConverter"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="⚖️ Unit Converter"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnNotes"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📝 Notes / To-Do"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnPremium"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="⭐ Premium Screen"
                        android:layout_marginBottom="8dp" />

                </LinearLayout>
            </ScrollView>

            <TextView
                android:layout_width="match_parent"
                android:layout_height="50dp"
                android:background="#DDDDDD"
                android:gravity="center"
                android:text="[ AdMob Banner Ad Container ]"
                android:textColor="#555555"
                android:textSize="12sp"
                android:layout_marginTop="8dp" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_qr_scanner.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="20dp"
            android:gravity="center">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="QR Scanner"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginBottom="30dp" />

            <TextView
                android:id="@+id/tvScanResult"
                android:layout_width="match_parent"
                android:layout_height="120dp"
                android:background="#EEEEEE"
                android:gravity="center"
                android:text="Point camera or tap below to simulate scan"
                android:textSize="16sp"
                android:padding="10dp"
                android:layout_marginBottom="20dp" />

            <Button
                android:id="@+id/btnScan"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Start Scan" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_unit_converter.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="20dp"
            android:gravity="center_horizontal">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Unit Converter"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginBottom="30dp" />

            <EditText
                android:id="@+id/etValue"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:hint="Enter value in Kilograms"
                android:inputType="numberDecimal"
                android:layout_marginBottom="20dp" />

            <Button
                android:id="@+id/btnConvert"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Convert to Grams"
                android:layout_marginBottom="20dp" />

            <TextView
                android:id="@+id/tvConvertedResult"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Result will appear here"
                android:textSize="18sp"
                android:textStyle="bold" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/MainActivity.kt
        package com.easytools.app

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                findViewById<Button>(R.id.btnImgToPdf).setOnClickListener {
                    startActivity(Intent(this, ImageToPdfActivity::class.java))
                }
                findViewById<Button>(R.id.btnPdfToImg).setOnClickListener {
                    startActivity(Intent(this, PdfToImgActivity::class.java))
                }
                findViewById<Button>(R.id.btnCompressor).setOnClickListener {
                    startActivity(Intent(this, ImageCompressorActivity::class.java))
                }
                findViewById<Button>(R.id.btnQrScanner).setOnClickListener {
                    startActivity(Intent(this, QrScannerActivity::class.java))
                }
                findViewById<Button>(R.id.btnUnitConverter).setOnClickListener {
                    startActivity(Intent(this, UnitConverterActivity::class.java))
                }
                findViewById<Button>(R.id.btnNotes).setOnClickListener {
                    Toast.makeText(this, "Notes / To-Do Clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnPremium).setOnClickListener {
                    Toast.makeText(this, "Premium Screen Clicked", Toast.LENGTH_SHORT).show()
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/ImageToPdfActivity.kt
        package com.easytools.app
        import android.app.Activity
        import android.content.Intent
        import android.graphics.Canvas
        import android.graphics.pdf.PdfDocument
        import android.net.Uri
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream
        class ImageToPdfActivity : AppCompatActivity() {
            private val REQ = 1
            private var uri: Uri? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_to_pdf)
                supportActionBar?.title = "Image to PDF"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)
                val tv = findViewById<TextView>(R.id.tvStatus)
                val btnCreate = findViewById<Button>(R.id.btnCreatePdf)
                findViewById<Button>(R.id.btnSelectImage).setOnClickListener {
                    startActivityForResult(Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI), REQ)
                }
                btnCreate.setOnClickListener {
                    uri?.let {
                        val bmp = MediaStore.Images.Media.getBitmap(contentResolver, it)
                        val doc = PdfDocument()
                        val page = doc.startPage(PdfDocument.PageInfo.Builder(bmp.width, bmp.height, 1).create())
                        page.canvas.drawBitmap(bmp, 0f, 0f, null)
                        doc.finishPage(page)
                        val file = File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "PDF_${System.currentTimeMillis()}.pdf")
                        doc.writeTo(FileOutputStream(file))
                        doc.close()
                        Toast.makeText(this, "PDF Saved!", Toast.LENGTH_LONG).show()
                        tv.text = "Saved: ${file.name}"
                    }
                }
            }
            override fun onActivityResult(r: Int, res: Int, data: Intent?) {
                super.onActivityResult(r, res, data)
                if (r == REQ && res == Activity.RESULT_OK && data != null) {
                    uri = data.data
                    findViewById<TextView>(R.id.tvStatus).text = "Image Selected!"
                    findViewById<Button>(R.id.btnCreatePdf).isEnabled = true
                }
            }
            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/PdfToImgActivity.kt
        package com.easytools.app
        import android.app.Activity
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        class PdfToImgActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_pdf_to_img)
                supportActionBar?.title = "PDF to Image"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)
                val tv = findViewById<TextView>(R.id.tvPdfStatus)
                val btnExt = findViewById<Button>(R.id.btnExtractImages)
                findViewById<Button>(R.id.btnSelectPdf).setOnClickListener {
                    startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).apply { type = "application/pdf" }, 2)
                }
                btnExt.setOnClickListener {
                    Toast.makeText(this, "Extracted to Images!", Toast.LENGTH_SHORT).show()
                    tv.text = "Extraction Complete!"
                }
            }
            override fun onActivityResult(r: Int, res: Int, data: Intent?) {
                super.onActivityResult(r, res, data)
                if (r == 2 && res == Activity.RESULT_OK && data != null) {
                    findViewById<TextView>(R.id.tvPdfStatus).text = "PDF Loaded Successfully!"
                    findViewById<Button>(R.id.btnExtractImages).isEnabled = true
                }
            }
            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/ImageCompressorActivity.kt
        package com.easytools.app
        import android.app.Activity
        import android.content.Intent
        import android.graphics.Bitmap
        import android.net.Uri
        import android.os.Bundle
        import android.provider.MediaStore
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import java.io.File
        import java.io.FileOutputStream
        class ImageCompressorActivity : AppCompatActivity() {
            private var uri: Uri? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_image_compressor)
                supportActionBar?.title = "Image Compressor"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)
                val tv = findViewById<TextView>(R.id.tvCompStatus)
                val btnC = findViewById<Button>(R.id.btnCompress)
                findViewById<Button>(R.id.btnSelectCompImage).setOnClickListener {
                    startActivityForResult(Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI), 3)
                }
                btnC.setOnClickListener {
                    uri?.let {
                        val bmp = MediaStore.Images.Media.getBitmap(contentResolver, it)
                        val file = File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "Compressed_${System.currentTimeMillis()}.jpg")
                        val out = FileOutputStream(file)
                        bmp.compress(Bitmap.CompressFormat.JPEG, 40, out)
                        out.close()
                        Toast.makeText(this, "Compressed & Saved!", Toast.LENGTH_LONG).show()
                        tv.text = "Saved: ${file.name}"
                    }
                }
            }
            override fun onActivityResult(r: Int, res: Int, data: Intent?) {
                super.onActivityResult(r, res, data)
                if (r == 3 && res == Activity.RESULT_OK && data != null) {
                    uri = data.data
                    findViewById<TextView>(R.id.tvCompStatus).text = "Image Ready for Compression!"
                    findViewById<Button>(R.id.btnCompress).isEnabled = true
                }
            }
            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/QrScannerActivity.kt
        package com.easytools.app
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        class QrScannerActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_qr_scanner)
                supportActionBar?.title = "QR Scanner"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)
                val tvResult = findViewById<TextView>(R.id.tvScanResult)
                findViewById<Button>(R.id.btnScan).setOnClickListener {
                    tvResult.text = "Scanned Result: https://github.com/easytools"
                }
            }
