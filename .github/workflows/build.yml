name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.easytools.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
            
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity
                    android:name=".ImageToPdfActivity"
                    android:exported="false" />
                <activity
                    android:name=".PdfToImgActivity"
                    android:exported="false" />
                <activity
                    android:name=".ImageCompressorActivity"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp"
            android:gravity="center_horizontal">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="EasyTools v2.0"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginTop="10dp"
                android:layout_marginBottom="16dp" />

            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical">

                    <Button
                        android:id="@+id/btnImgToPdf"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="🖼 Image to PDF"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnPdfToImg"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📄 PDF to Image"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnCompressor"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📦 Image Compressor"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnQrScanner"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📷 QR Scanner"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnUnitConverter"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="⚖️ Unit Converter"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnNotes"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="📝 Notes / To-Do"
                        android:layout_marginBottom="8dp" />

                    <Button
                        android:id="@+id/btnPremium"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="⭐ Premium Screen"
                        android:layout_marginBottom="8dp" />

                </LinearLayout>
            </ScrollView>

            <TextView
                android:layout_width="match_parent"
                android:layout_height="50dp"
                android:background="#DDDDDD"
                android:gravity="center"
                android:text="[ AdMob Banner Ad Container ]"
                android:textColor="#555555"
                android:textSize="12sp"
                android:layout_marginTop="8dp" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_image_to_pdf.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
