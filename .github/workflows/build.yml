name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clean Previous Build Files
      run: |
        rm -rf app/src/main/java/com/easytools/app/*
        rm -rf app/src/main/res/layout/*
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

    - name: Generate Fresh Project Files
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:icon="@android:drawable/ic_menu_manage"
                android:roundIcon="@android:drawable/ic_menu_manage"
                android:supportsRtl="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".AgeCalculatorActivity" android:exported="false" />
                <activity android:name=".UnitConverterActivity" android:exported="false" />
                <activity android:name=".ImageCompressorActivity" android:exported="false" />
                <activity android:name=".TextToSpeechActivity" android:exported="false" />
                <activity android:name=".QrScannerActivity" android:exported="false" />
                <activity android:name=".ImageToPdfActivity" android:exported="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1B2A"
            android:padding="16dp">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="#1B263B"
                android:padding="16dp"
                android:layout_marginBottom="16dp"
                android:gravity="center_horizontal">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="EasyTools v18.0"
                    android:textSize="26sp"
                    android:textStyle="bold"
                    android:textColor="#FFFFFF"/>
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Stable &amp; Fast"
                    android:textSize="14sp"
                    android:textColor="#B0BEC5"
                    android:layout_marginTop="4dp"/>
            </LinearLayout>

            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:scrollbars="none">
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical">

                    <!-- Tool 1 -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardImageCompressor"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="14dp" android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🗜️" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Image Compressor" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Reduce image file sizes instantly" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 2 -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardTextToSpeech"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="14dp" android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔊" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Text to Speech" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Convert typed text into speech audio" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 3 -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardAgeCalculator"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="14dp" android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🎂" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Age Calculator" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Calculate exact age in years &amp; months" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 4 -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardUnitConverter"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="14dp" android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="⚖️" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Unit Converter" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Convert Kilograms to Grams &amp; Pounds" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 5 -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardQrScanner"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="14dp" android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📷" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="QR Scanner" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Scan and read QR codes or barcodes" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 6 -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardImageToPdf"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="14dp" android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📁" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Image to PDF" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Convert selected images into PDF format" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                </LinearLayout>
            </ScrollView>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_age_calculator.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1B2A"
            android:padding="20dp">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Age Calculator" android:textSize="24sp" android:textStyle="bold" android:textColor="#FFFFFF" android:layout_marginBottom="20dp"/>
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Enter Date of Birth (YYYY-MM-DD):" android:textColor="#B0BEC5" android:textSize="14sp" android:layout_marginBottom="8dp"/>
            <EditText android:id="@+id/etDob" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="1990-05-15" android:textColor="#FFFFFF" android:textColorHint="#546E7A" android:background="#1B263B" android:padding="12dp" android:layout_marginBottom="20dp"/>
            <Button android:id="@+id/btnCalculate" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Calculate Exact Age" android:backgroundTint="#1B263B" android:textColor="#FFFFFF" android:layout_marginBottom="20dp"/>
            <TextView android:id="@+id/tvAgeResult" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Result will appear here..." android:textSize="16sp" android:textStyle="bold" android:textColor="#4CAF50" android:gravity="center" android:layout_marginBottom="30dp"/>
            <Button android:id="@+id/btnBackAge" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Back to Dashboard" android:layout_gravity="center"/>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_unit_converter.xml
        <?xml version="1.0" encoding="utf-8"?>
