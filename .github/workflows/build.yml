name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:icon="@android:drawable/ic_menu_manage"
                android:roundIcon="@android:drawable/ic_menu_manage"
                android:supportsRtl="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".AgeCalculatorActivity" android:exported="false" />
                <activity android:name=".UnitConverterActivity" android:exported="false" />
                <activity android:name=".ImageCompressorActivity" android:exported="false" />
                <activity android:name=".TextToSpeechActivity" android:exported="false" />
            </application>
        </manifest>
        EOF

