name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.easytools.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="16dp"
            android:gravity="center">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="EasyTools Complete v2.0"
                android:textSize="22sp"
                android:textStyle="bold"
                android:layout_marginBottom="24dp" />

            <Button
                android:id="@+id/btnTool1"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Image to PDF Tool"
                android:layout_marginBottom="12dp" />

            <Button
                android:id="@+id/btnTool2"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Unit Converter"
                android:layout_marginBottom="12dp" />

            <Button
                android:id="@+id/btnTool3"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="QR Scanner" />

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/MainActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                findViewById<Button>(R.id.btnTool1).setOnClickListener {
                    Toast.makeText(this, "Image to PDF clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnTool2).setOnClickListener {
                    Toast.makeText(this, "Unit Converter clicked", Toast.LENGTH_SHORT).show()
                }
                findViewById<Button>(R.id.btnTool3).setOnClickListener {
                    Toast.makeText(this, "QR Scanner clicked", Toast.LENGTH_SHORT).show()
                }
            }
        }
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.1.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.easytools.app"
            compileSdk = 35
            defaultConfig {
                applicationId = "com.easytools.app"
                minSdk = 24
                targetSdk = 35
                versionCode = 2
                versionName = "2.0"
            }
            buildTypes {
                release { isMinifyEnabled = false }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.15.0")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("com.google.android.material:material:1.12.0")
            implementation("androidx.activity:activity-ktx:1.10.0")
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "EasyTools"
        include(":app")
        EOF

        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties
        echo "kotlin.code.style=official" >> gradle.properties

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        arguments: assembleDebug
        gradle-version: '8.1'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EasyTools-APK
        path: app/build/outputs/apk/debug/app-debug.apk
