name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/java/com/easytools/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="EasyTools"
                android:icon="@android:drawable/ic_menu_manage"
                android:roundIcon="@android:drawable/ic_menu_manage"
                android:supportsRtl="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".ToolActivity" android:exported="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1B2A"
            android:padding="16dp">

            <!-- Header Section -->
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="#1B263B"
                android:padding="16dp"
                android:layout_marginBottom="16dp"
                android:gravity="center_horizontal">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="EasyTools"
                    android:textSize="26sp"
                    android:textStyle="bold"
                    android:textColor="#FFFFFF"/>
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="All Your Everyday Tools in One App"
                    android:textSize="14sp"
                    android:textColor="#B0BEC5"
                    android:layout_marginTop="4dp"/>
            </LinearLayout>

            <!-- Tools Grid / List -->
            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:scrollbars="none">
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical">

                    <!-- Tool 1: Image to PDF -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardImageToPdf"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:elevation="4dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:orientation="horizontal"
                            android:padding="14dp"
                            android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🖼️" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Image to PDF" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Convert your images to PDF easily" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 2: QR Scanner -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardQrScanner"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:elevation="4dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:orientation="horizontal"
                            android:padding="14dp"
                            android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📷" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="QR Scanner" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Scan QR codes and barcodes instantly" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 3: Unit Converter -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardUnitConverter"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:elevation="4dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:orientation="horizontal"
                            android:padding="14dp"
                            android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="⚖️" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Unit Converter" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Convert weight, length and other units" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 4: Image Compressor -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardImageCompressor"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:elevation="4dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:orientation="horizontal"
                            android:padding="14dp"
                            android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🗜️" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Image Compressor" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Reduce image size without losing quality" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 5: Text to Speech -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardTextToSpeech"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:elevation="4dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:orientation="horizontal"
                            android:padding="14dp"
                            android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔊" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Text to Speech" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Convert written text into spoken audio" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                    <!-- Tool 6: Age Calculator -->
                    <androidx.cardview.widget.CardView
                        android:id="@+id/cardAgeCalculator"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:layout_marginBottom="10dp"
                        android:elevation="4dp"
                        android:clickable="true"
                        android:focusable="true">
                        <LinearLayout
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:orientation="horizontal"
                            android:padding="14dp"
                            android:background="#1B263B">
                            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🎂" android:textSize="26sp" android:layout_marginRight="14dp"/>
                            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Age Calculator" android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Calculate exact age in years and months" android:textSize="12sp" android:textColor="#B0BEC5"/>
                            </LinearLayout>
                        </LinearLayout>
                    </androidx.cardview.widget.CardView>

                </LinearLayout>
            </ScrollView>

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_tool.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#0D1B2A"
            android:padding="20dp"
            android:gravity="center">

            <TextView
                android:id="@+id/tvToolTitle"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Tool Title"
                android:textSize="24sp"
                android:textStyle="bold"
                android:textColor="#FFFFFF"
                android:layout_marginBottom="16dp"/>

            <TextView
                android:id="@+id/tvToolDesc"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="This tool is ready to use."
                android:textSize="16sp"
                android:textColor="#B0BEC5"
                android:gravity="center"
                android:layout_marginBottom="30dp"/>

            <Button
                android:id="@+id/btnBack"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Back to Dashboard"
                android:textColor="#FFFFFF"/>

        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/MainActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.content.Intent
        import android.app.Activity
        import androidx.cardview.widget.CardView

        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                findViewById<CardView>(R.id.cardImageToPdf).setOnClickListener { openTool("Image to PDF", "Select images to convert them into a single PDF document.") }
                findViewById<CardView>(R.id.cardQrScanner).setOnClickListener { openTool("QR Scanner", "Use camera to scan QR codes and barcodes instantly.") }
                findViewById<CardView>(R.id.cardUnitConverter).setOnClickListener { openTool("Unit Converter", "Convert different units of weight, length, and volume.") }
                findViewById<CardView>(R.id.cardImageCompressor).setOnClickListener { openTool("Image Compressor", "Reduce image file sizes easily without losing visual quality.") }
                findViewById<CardView>(R.id.cardTextToSpeech).setOnClickListener { openTool("Text to Speech", "Type text and convert it into clear spoken audio voice.") }
                findViewById<CardView>(R.id.cardAgeCalculator).setOnClickListener { openTool("Age Calculator", "Find out your precise age in years, months, and days.") }
            }

            private fun openTool(title: String, desc: String) {
                val intent = Intent(this, ToolActivity::class.java)
                intent.putExtra("TITLE", title)
                intent.putExtra("DESC", desc)
                startActivity(intent)
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/ToolActivity.kt
        package com.easytools.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import android.app.Activity

        class ToolActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_tool)

                val title = intent.getStringExtra("TITLE") ?: "Tool"
                val desc = intent.getStringExtra("DESC") ?: "Details"

                findViewById<TextView>(R.id.tvToolTitle).text = title
                findViewById<TextView>(R.id.tvToolDesc).text = desc

                findViewById<Button>(R.id.btnBack).setOnClickListener {
                    finish()
                }
            }
        }
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.20" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.easytools.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.easytools.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 90
                versionName = "9.0"
            }
            buildTypes {
                release { isMinifyEnabled = false }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.cardview:cardview:1.0.0")
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "EasyTools"
        include(":app")
        EOF

        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        arguments: assembleDebug
        gradle-version: '8.5'

    - name: Upload APK-v9.0
      uses: actions/upload-artifact@v4
      with:
        name: EasyTools-APK
        path: app/build/outputs/apk/debug/app-debug.apk
