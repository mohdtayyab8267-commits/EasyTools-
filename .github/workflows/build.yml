        EOF

        cat << 'EOF' > app/src/main/java/com/easytools/app/UnitConverterActivity.kt
        package com.easytools.app
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        class UnitConverterActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_unit_converter)
                supportActionBar?.title = "Unit Converter"
                supportActionBar?.setDisplayHomeAsUpEnabled(true)
                val etValue = findViewById<EditText>(R.id.etValue)
                val tvResult = findViewById<TextView>(R.id.tvConvertedResult)
                findViewById<Button>(R.id.btnConvert).setOnClickListener {
                    val input = etValue.text.toString().toDoubleOrNull()
                    if (input != null) {
                        val grams = input * 1000
                        tvResult.text = "$input KG = $grams Grams"
                    } else {
                        tvResult.text = "Please enter a valid number"
                    }
                }
            }
            override fun onSupportNavigateUp(): Boolean { finish(); return true }
        }
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.1.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.easytools.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.easytools.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 5
                versionName = "5.0"
            }
            buildTypes {
                release { isMinifyEnabled = false }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "EasyTools"
        include(":app")
        EOF

        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        arguments: assembleDebug
        gradle-version: '8.1'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EasyTools-APK
        path: app/build/outputs/apk/debug/app-debug.apk
